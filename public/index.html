<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Machine — Registro de Demandas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --azul: #2563EB;
    --azul-escuro: #1D4ED8;
    --ciano: #06B6D4;
    --bg: #F4F6FB;
    --texto: #1E2A3A;
    --texto-suave: #64748A;
    --branco: #FFFFFF;
    --borda: #E2E8F0;
    --erro: #DC2626;
    --sucesso: #16A34A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--texto);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #app {
    width: 100%;
    max-width: 460px;
    height: 100vh;
    max-height: 780px;
    background: var(--branco);
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(29,78,216,0.12);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    background: linear-gradient(135deg, #1D4ED8, #2563EB, #06B6D4);
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  header svg { width: 34px; height: 34px; flex-shrink: 0; }
  header .title { color: #fff; }
  header .title strong { font-size: 15px; display: block; font-weight: 700; }
  header .title span { font-size: 12px; opacity: 0.85; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: var(--bg);
  }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; }
  .msg.bot { background: #fff; border: 1px solid var(--borda); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.bot strong { font-weight: 700; }
  .msg.bot a { color: var(--azul); text-decoration: underline; font-weight: 500; }
  .msg.bot a:hover { color: var(--azul-escuro); }
  .msg.user { background: var(--azul); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.system-note { align-self: center; font-size: 12px; color: var(--texto-suave); background: transparent; }

  .typing { align-self: flex-start; display: flex; gap: 4px; padding: 12px 14px; background: #fff; border: 1px solid var(--borda); border-radius: 14px; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--texto-suave); animation: blink 1.2s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  .summary-card {
    align-self: center;
    width: 100%;
    background: #fff;
    border: 1px solid var(--borda);
    border-radius: 14px;
    padding: 16px;
    font-size: 13.5px;
  }
  .summary-card h4 { margin: 0 0 10px; font-size: 13px; color: var(--azul-escuro); text-transform: uppercase; letter-spacing: 0.04em; }
  .summary-card .row { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px dashed var(--borda); }
  .summary-card .row:last-of-type { border-bottom: none; }
  .summary-card .row b { color: var(--texto-suave); font-weight: 500; flex-shrink: 0; }
  .summary-card .row span { text-align: right; }
  .summary-actions { display: flex; gap: 8px; margin-top: 14px; }
  .summary-actions button { flex: 1; padding: 10px; border-radius: 10px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn-corrigir { background: #fff; border: 1px solid var(--borda); color: var(--texto); }
  .btn-confirmar { background: var(--azul); color: #fff; }
  .btn-confirmar:disabled { opacity: 0.6; cursor: default; }

  .result-card { align-self: center; width: 100%; border-radius: 14px; padding: 14px 16px; font-size: 13.5px; display: flex; gap: 10px; align-items: flex-start; }
  .result-card.ok { background: #F0FDF4; border: 1px solid #BBF7D0; color: #14532D; }
  .result-card.warn { background: #FFF7ED; border: 1px solid #FED7AA; color: #7C2D12; }
  .result-card.err { background: #FEF2F2; border: 1px solid #FECACA; color: #7F1D1D; }

  #inputbar { display: flex; gap: 8px; padding: 14px; border-top: 1px solid var(--borda); background: #fff; flex-shrink: 0; }
  #inputbar input { flex: 1; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--borda); font-size: 14px; font-family: inherit; outline: none; }
  #inputbar input:focus { border-color: var(--azul); }
  #inputbar button { background: var(--azul); border: none; color: #fff; width: 42px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  #inputbar button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>

<div id="app">
  <header>
    <svg viewBox="0 0 40 40" fill="none">
      <circle cx="10" cy="10" r="4" fill="#fff"/>
      <circle cx="30" cy="10" r="4" fill="#fff"/>
      <circle cx="10" cy="30" r="4" fill="#fff"/>
      <circle cx="30" cy="30" r="4" fill="#fff"/>
      <circle cx="20" cy="20" r="5" fill="#fff"/>
      <line x1="10" y1="10" x2="20" y2="20" stroke="#fff" stroke-width="2"/>
      <line x1="30" y1="10" x2="20" y2="20" stroke="#fff" stroke-width="2"/>
      <line x1="10" y1="30" x2="20" y2="20" stroke="#fff" stroke-width="2"/>
      <line x1="30" y1="30" x2="20" y2="20" stroke="#fff" stroke-width="2"/>
    </svg>
    <div class="title">
      <strong>Central de Demandas Machine</strong>
      <span>Conte pra gente o que você precisa</span>
    </div>
  </header>
  <div id="messages"></div>
  <div id="inputbar">
    <input id="userInput" type="text" placeholder="Digite sua mensagem..." autocomplete="off">
    <button id="sendBtn" title="Enviar">➤</button>
  </div>
</div>


<script src="/app.js"></script>
</html>
