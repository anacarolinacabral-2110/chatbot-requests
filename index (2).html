<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Machine — Central de Demandas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue:       #2563EB;
      --blue-dark:  #1D4ED8;
      --blue-light: #EFF6FF;
      --cyan:       #06B6D4;
      --orange:     #F97316;
      --bg:         #F1F5F9;
      --surface:    #FFFFFF;
      --border:     #E2E8F0;
      --text:       #0F172A;
      --text-muted: #64748B;
      --font:       'Inter', sans-serif;
      --radius:     20px;
      --radius-sm:  12px;
    }
    body {
      font-family: var(--font);
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #chat-screen {
      width: 100%;
      max-width: 640px;
      height: 90vh;
      max-height: 780px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(37,99,235,0.10);
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .chat-header {
      background: linear-gradient(135deg, #1D4ED8 0%, #2563EB 60%, #06B6D4 100%);
      padding: 18px 22px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }
    .chat-logo {
      width: 42px; height: 42px;
      background: rgba(255,255,255,0.15);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .chat-logo svg { width: 22px; height: 22px; }
    .chat-header-name { font-size: 15px; font-weight: 700; color: #fff; letter-spacing: -0.2px; }
    .chat-header-sub { font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 1px; }
    .online-dot { display: inline-block; width: 7px; height: 7px; background: #4ADE80; border-radius: 50%; margin-right: 5px; }

    /* Messages */
    #messages {
      flex: 1; overflow-y: auto;
      padding: 22px 20px;
      display: flex; flex-direction: column; gap: 14px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .msg { display: flex; gap: 8px; max-width: 84%; animation: fadeUp 0.2s ease; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot  { align-self: flex-start; }

    .msg-avatar {
      width: 30px; height: 30px; border-radius: 10px;
      background: var(--blue-light);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 2px;
    }
    .msg-avatar svg { width: 15px; height: 15px; }

    .msg-bubble {
      padding: 11px 15px; border-radius: 18px;
      font-size: 14px; line-height: 1.6;
    }
    .msg.bot  .msg-bubble { background: #F8FAFC; color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .msg.user .msg-bubble { background: var(--blue); color: #fff; border-bottom-right-radius: 4px; }

    /* Typing */
    .typing-bubble { display: flex; align-items: center; gap: 5px; padding: 14px 16px; }
    .typing-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); animation: bounce 1.3s infinite ease-in-out; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-7px)} }

    /* Summary card */
    .summary-wrap { display: flex; flex-direction: column; gap: 10px; max-width: 92%; align-self: flex-start; animation: fadeUp 0.2s ease; width: 100%; }

    .summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .summary-card-header {
      background: linear-gradient(135deg, #1D4ED8, #2563EB);
      padding: 12px 16px;
      font-weight: 600; font-size: 13px; color: #fff;
      display: flex; align-items: center; gap: 8px;
    }
    .summary-row { display: flex; padding: 10px 16px; gap: 10px; border-bottom: 1px solid #F1F5F9; }
    .summary-row:last-child { border-bottom: none; }
    .summary-label { color: var(--text-muted); min-width: 80px; font-size: 12px; font-weight: 500; padding-top: 1px; flex-shrink: 0; }
    .summary-value { color: var(--text); font-size: 13px; line-height: 1.5; }

    .confirm-btns { display: flex; gap: 8px; }
    .confirm-btn {
      flex: 1; padding: 12px;
      border: none; border-radius: var(--radius-sm);
      font-family: var(--font); font-size: 14px; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
    }
    .confirm-btn.primary {
      background: var(--blue); color: #fff;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .confirm-btn.primary:hover { background: var(--blue-dark); }
    .confirm-btn.primary:disabled { background: var(--border); cursor: not-allowed; }
    .confirm-btn.secondary {
      background: #F1F5F9; color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .confirm-btn.secondary:hover { background: var(--border); }
    .confirm-btn svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

    /* Input */
    .input-area {
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      display: flex; gap: 10px; align-items: flex-end;
      background: var(--surface); flex-shrink: 0;
    }
    #user-input {
      flex: 1; font-family: var(--font); font-size: 14px;
      padding: 11px 16px;
      border: 1.5px solid var(--border); border-radius: 22px;
      background: #F8FAFC; color: var(--text);
      resize: none; max-height: 110px; min-height: 44px; line-height: 1.5;
      transition: border-color 0.15s;
    }
    #user-input:focus { outline: none; border-color: var(--blue); background: #fff; }
    #user-input::placeholder { color: #CBD5E1; }

    #send-btn {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--blue); border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background 0.15s, transform 0.1s;
    }
    #send-btn:hover { background: var(--blue-dark); }
    #send-btn:active { transform: scale(0.95); }
    #send-btn:disabled { background: var(--border); cursor: not-allowed; }
    #send-btn svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>
  <div id="chat-screen">
    <div class="chat-header">
      <div class="chat-logo">
        <!-- Machine logo mark simplified -->
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="3" fill="#fff"/>
          <circle cx="4"  cy="8"  r="2" fill="rgba(255,255,255,0.6)"/>
          <circle cx="20" cy="8"  r="2" fill="rgba(255,255,255,0.6)"/>
          <circle cx="4"  cy="16" r="2" fill="rgba(255,255,255,0.6)"/>
          <circle cx="20" cy="16" r="2" fill="rgba(255,255,255,0.6)"/>
          <line x1="9" y1="12" x2="6"  y2="9"  stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
          <line x1="15" y1="12" x2="18" y2="9"  stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
          <line x1="9" y1="12" x2="6"  y2="15" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
          <line x1="15" y1="12" x2="18" y2="15" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
        </svg>
      </div>
      <div>
        <div class="chat-header-name">Machine — Central de Demandas</div>
        <div class="chat-header-sub"><span class="online-dot"></span>Assistente online</div>
      </div>
    </div>

    <div id="messages"></div>

    <div class="input-area">
      <textarea id="user-input" placeholder="Digite sua mensagem..." rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button id="send-btn" onclick="sendMessage()" aria-label="Enviar">
        <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

  <script>
    let conversationHistory = [];
    let isTyping = false;
    let pendingSummaryData = null;

    window.onload = () => {
      addBotMessage('Olá! 👋 Sou o assistente da Machine. Vou te ajudar a registrar sua demanda rapidinho.\n\nPrimeiro, qual é o seu nome e o código da sua central?');
      document.getElementById('user-input').focus();
    };

    function addBotMessage(text) {
      const msgs = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'msg bot';
      div.innerHTML = `
        <div class="msg-avatar">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" fill="#2563EB"/><circle cx="4" cy="8" r="2" fill="#93C5FD"/><circle cx="20" cy="8" r="2" fill="#93C5FD"/><circle cx="4" cy="16" r="2" fill="#93C5FD"/><circle cx="20" cy="16" r="2" fill="#93C5FD"/></svg>
        </div>
        <div class="msg-bubble">${text.replace(/\n/g, '<br>')}</div>`;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function addUserMessage(text) {
      const msgs = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'msg user';
      div.innerHTML = `<div class="msg-bubble">${text.replace(/\n/g, '<br>')}</div>`;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function addSummaryCard(data) {
      pendingSummaryData = data;
      const msgs = document.getElementById('messages');
      const wrap = document.createElement('div');
      wrap.className = 'summary-wrap';
      wrap.innerHTML = `
        <div class="summary-card">
          <div class="summary-card-header">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            Resumo da Demanda
          </div>
          <div class="summary-row"><span class="summary-label">Nome</span><span class="summary-value">${data.nome_cliente || '-'}</span></div>
          <div class="summary-row"><span class="summary-label">Central</span><span class="summary-value">${data.codigo_central || '-'}</span></div>
          <div class="summary-row"><span class="summary-label">Área</span><span class="summary-value">${data.area_produto || '-'}</span></div>
          <div class="summary-row"><span class="summary-label">Pedido</span><span class="summary-value">${data.nome_pedido || '-'}</span></div>
          <div class="summary-row"><span class="summary-label">Resumo</span><span class="summary-value">${data.resumo_executivo || '-'}</span></div>
        </div>
        <div class="confirm-btns">
          <button class="confirm-btn secondary" onclick="rejectSummary()">✏️ Corrigir</button>
          <button class="confirm-btn primary" id="make-btn" onclick="sendToMake()">
            <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            Confirmar e enviar
          </button>
        </div>`;
      msgs.appendChild(wrap);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function rejectSummary() {
      pendingSummaryData = null;
      addBotMessage('Sem problema! Me diz o que precisa corrigir.');
      // Re-enable input
      document.getElementById('user-input').disabled = false;
      document.getElementById('send-btn').disabled = false;
      document.getElementById('user-input').focus();
    }

    function showTyping() {
      const msgs = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'msg bot'; div.id = 'typing-indicator';
      div.innerHTML = `
        <div class="msg-avatar"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" fill="#2563EB"/><circle cx="4" cy="8" r="2" fill="#93C5FD"/><circle cx="20" cy="8" r="2" fill="#93C5FD"/><circle cx="4" cy="16" r="2" fill="#93C5FD"/><circle cx="20" cy="16" r="2" fill="#93C5FD"/></svg></div>
        <div class="msg-bubble typing-bubble"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function removeTyping() {
      const el = document.getElementById('typing-indicator');
      if (el) el.remove();
    }

    function parseSummaryJson(text) {
      const marker = 'SUMMARY_JSON:';
      const idx = text.indexOf(marker);
      if (idx === -1) return null;
      try {
        const jsonStr = text.slice(idx + marker.length).trim().replace(/```json|```/g, '').trim();
        return JSON.parse(jsonStr);
      } catch(e) { return null; }
    }

    async function sendToMake() {
      if (!pendingSummaryData) return;
      const btn = document.getElementById('make-btn');
      if (btn) { btn.disabled = true; btn.innerHTML = 'Enviando...'; }
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sendToMake: true, summaryData: pendingSummaryData })
        });
        if (res.ok) {
          addBotMessage('✅ Demanda registrada com sucesso! Nosso time já foi notificado e em breve entrará em contato. Obrigado! 😊');
        } else {
          addBotMessage('⚠️ Não foi possível enviar. Tente novamente ou entre em contato com o suporte.');
          if (btn) { btn.disabled = false; btn.innerHTML = '<svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Confirmar e enviar'; }
        }
      } catch(e) {
        addBotMessage('⚠️ Erro de conexão. Tente novamente em instantes.');
        if (btn) { btn.disabled = false; }
      }
    }

    async function callBackend(userMessage) {
      conversationHistory.push({ role: 'user', content: userMessage });
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: conversationHistory })
      });
      if (!response.ok) throw new Error('Erro no servidor');
      const data = await response.json();
      conversationHistory.push({ role: 'assistant', content: data.text });
      return data.text;
    }

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text || isTyping) return;
      input.value = '';
      input.style.height = 'auto';
      addUserMessage(text);
      isTyping = true;
      document.getElementById('send-btn').disabled = true;
      showTyping();
      try {
        const reply = await callBackend(text);
        removeTyping();
        const jsonData = parseSummaryJson(reply);
        if (jsonData) {
          // Mostra aviso antes do card
          addBotMessage('Perfeito! Preparei um resumo da sua demanda. Confere se está tudo certo antes de enviar 👇');
          addSummaryCard(jsonData);
        } else {
          addBotMessage(reply);
        }
      } catch(e) {
        removeTyping();
        addBotMessage('Desculpe, ocorreu um erro. Por favor, tente novamente em instantes.');
      }
      isTyping = false;
      document.getElementById('send-btn').disabled = false;
      document.getElementById('user-input').focus();
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 110) + 'px';
    }
  </script>
</body>
</html>
