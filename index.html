<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Central de Demandas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green-dark: #085041;
      --green-mid: #0F6E56;
      --green-main: #1D9E75;
      --green-light: #5DCAA5;
      --green-pale: #E1F5EE;
      --bg: #f7f8f6;
      --surface: #ffffff;
      --border: #e2e6e1;
      --text: #1a1f1a;
      --text-muted: #6b7a6a;
      --font: 'DM Sans', sans-serif;
      --radius: 16px;
      --radius-sm: 10px;
    }
    body {
      font-family: var(--font);
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #chat-screen {
      width: 100%;
      max-width: 640px;
      height: 90vh;
      max-height: 760px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 4px 32px rgba(0,0,0,0.07);
      display: flex;
      flex-direction: column;
    }
    .chat-header {
      background: var(--green-dark);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .chat-avatar {
      width: 40px; height: 40px;
      background: rgba(255,255,255,0.12);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .chat-avatar svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .chat-header-name { font-size: 15px; font-weight: 600; color: #fff; }
    .chat-header-status { font-size: 12px; color: rgba(255,255,255,0.65); }
    .online-dot { display: inline-block; width: 7px; height: 7px; background: var(--green-light); border-radius: 50%; margin-right: 5px; }

    #messages {
      flex: 1; overflow-y: auto;
      padding: 20px;
      display: flex; flex-direction: column; gap: 14px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .msg { display: flex; gap: 8px; max-width: 82%; animation: fadeUp 0.2s ease; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot { align-self: flex-start; }
    .msg-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--green-pale);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 2px;
    }
    .msg-avatar svg { width: 15px; height: 15px; fill: none; stroke: var(--green-mid); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .msg-bubble {
      padding: 11px 15px; border-radius: 18px;
      font-size: 14px; line-height: 1.55;
    }
    .msg.bot .msg-bubble { background: #f0f4f0; color: var(--text); border-bottom-left-radius: 4px; }
    .msg.user .msg-bubble { background: var(--green-main); color: #fff; border-bottom-right-radius: 4px; }

    .typing-bubble { display: flex; align-items: center; gap: 5px; padding: 14px 16px; }
    .typing-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); animation: bounce 1.3s infinite ease-in-out; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-7px)} }

    .summary-wrap { display: flex; flex-direction: column; gap: 8px; max-width: 88%; align-self: flex-start; animation: fadeUp 0.2s ease; }
    .summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; font-size: 13px; }
    .summary-card-header { background: var(--green-pale); padding: 10px 16px; font-weight: 600; font-size: 13px; color: var(--green-dark); border-bottom: 1px solid var(--border); }
    .summary-row { display: flex; padding: 9px 16px; gap: 8px; border-bottom: 1px solid #f0f0f0; }
    .summary-row:last-child { border-bottom: none; }
    .summary-label { color: var(--text-muted); min-width: 90px; font-size: 12px; padding-top: 1px; flex-shrink: 0; }
    .summary-value { color: var(--text); font-size: 13px; line-height: 1.5; }
    .send-make-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 18px;
      background: var(--green-main); color: #fff;
      border: none; border-radius: var(--radius-sm);
      font-family: var(--font); font-size: 14px; font-weight: 600;
      cursor: pointer; transition: background 0.15s; width: 100%;
    }
    .send-make-btn:hover { background: var(--green-mid); }
    .send-make-btn:disabled { background: var(--border); cursor: not-allowed; }
    .send-make-btn svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

    .input-area {
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      display: flex; gap: 10px; align-items: flex-end;
      background: var(--surface); flex-shrink: 0;
    }
    #user-input {
      flex: 1; font-family: var(--font); font-size: 14px;
      padding: 11px 15px;
      border: 1px solid var(--border); border-radius: 22px;
      background: var(--bg); color: var(--text);
      resize: none; max-height: 110px; min-height: 44px; line-height: 1.5;
      transition: border-color 0.15s;
    }
    #user-input:focus { outline: none; border-color: var(--green-main); }
    #user-input::placeholder { color: #bbb; }
    #send-btn {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--green-main); border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background 0.15s, transform 0.1s;
    }
    #send-btn:hover { background: var(--green-mid); }
    #send-btn:active { transform: scale(0.95); }
    #send-btn:disabled { background: var(--border); cursor: not-allowed; }
    #send-btn svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>
  <div id="chat-screen">
    <div class="chat-header">
      <div class="chat-avatar">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </div>
      <div>
        <div class="chat-header-name">Assistente de Demandas</div>
        <div class="chat-header-status"><span class="online-dot"></span>Online</div>
      </div>
    </div>

    <div id="messages"></div>

    <div class="input-area">
      <textarea id="user-input" placeholder="Digite sua mensagem..." rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button id="send-btn" onclick="sendMessage()" aria-label="Enviar">
        <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

  <script>
    let conversationHistory = [];
    let isTyping = false;

    // Ao carregar, o bot já inicia a conversa
    window.onload = () => {
      addBotMessage('Olá! 👋 Fico feliz em ajudar a registrar sua demanda. Para começar, pode me dizer seu nome e o código da sua central?');
      document.getElementById('user-input').focus();
    };

    function addBotMessage(text) {
      const msgs = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'msg bot';
      div.innerHTML = `
        <div class="msg-avatar"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
        <div class="msg-bubble">${text.replace(/\n/g, '<br>')}</div>`;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function addUserMessage(text) {
      const msgs = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'msg user';
      div.innerHTML = `<div class="msg-bubble">${text.replace(/\n/g, '<br>')}</div>`;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function addSummaryCard(preText, data) {
      if (preText) addBotMessage(preText);
      const msgs = document.getElementById('messages');
      const wrap = document.createElement('div');
      wrap.className = 'summary-wrap';
      wrap.innerHTML = `
        <div class="summary-card">
          <div class="summary-card-header">📋 Resumo da Demanda</div>
          <div class="summary-row"><span class="summary-label">Nome</span><span class="summary-value">${data.nome_cliente || '-'}</span></div>
          <div class="summary-row"><span class="summary-label">Central</span><span class="summary-value">${data.codigo_central || '-'}</span></div>
          <div class="summary-row"><span class="summary-label">Área</span><span class="summary-value">${data.area_produto || '-'}</span></div>
          <div class="summary-row"><span class="summary-label">Problema</span><span class="summary-value">${data.descricao_problema || '-'}</span></div>
          <div class="summary-row"><span class="summary-label">Impacto</span><span class="summary-value">${data.impacto_operacao || '-'}</span></div>
          <div class="summary-row"><span class="summary-label">Resumo</span><span class="summary-value">${data.resumo_executivo || '-'}</span></div>
        </div>
        <button class="send-make-btn" id="make-btn" onclick='sendToMake(${JSON.stringify(data).replace(/'/g, "&apos;")})'>
          <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          Enviar demanda para o time
        </button>`;
      msgs.appendChild(wrap);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function showTyping() {
      const msgs = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'msg bot'; div.id = 'typing-indicator';
      div.innerHTML = `
        <div class="msg-avatar"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
        <div class="msg-bubble typing-bubble"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function removeTyping() {
      const el = document.getElementById('typing-indicator');
      if (el) el.remove();
    }

    function parseSummaryJson(text) {
      const marker = 'SUMMARY_JSON:';
      const idx = text.indexOf(marker);
      if (idx === -1) return null;
      try {
        const jsonStr = text.slice(idx + marker.length).trim().replace(/```json|```/g, '').trim();
        return JSON.parse(jsonStr);
      } catch(e) { return null; }
    }

    async function sendToMake(data) {
      const btn = document.getElementById('make-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Enviando...'; }
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sendToMake: true, summaryData: data })
        });
        if (res.ok) {
          addBotMessage('✅ Demanda enviada com sucesso! O nosso time já foi notificado e em breve entrará em contato. Obrigado! 😊');
        } else {
          addBotMessage('⚠️ Não foi possível enviar a demanda. Por favor, tente novamente ou entre em contato pelo nosso canal de suporte.');
        }
      } catch(e) {
        addBotMessage('⚠️ Erro de conexão ao enviar. Tente novamente em alguns instantes.');
      }
    }

    async function callBackend(userMessage) {
      conversationHistory.push({ role: 'user', content: userMessage });
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: conversationHistory })
      });
      if (!response.ok) throw new Error('Erro no servidor');
      const data = await response.json();
      conversationHistory.push({ role: 'assistant', content: data.text });
      return data.text;
    }

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text || isTyping) return;
      input.value = '';
      input.style.height = 'auto';
      addUserMessage(text);
      isTyping = true;
      document.getElementById('send-btn').disabled = true;
      showTyping();
      try {
        const reply = await callBackend(text);
        removeTyping();
        const jsonData = parseSummaryJson(reply);
        if (jsonData) {
          const preText = reply.slice(0, reply.indexOf('SUMMARY_JSON:')).trim();
          addSummaryCard(preText, jsonData);
        } else {
          addBotMessage(reply);
        }
      } catch(e) {
        removeTyping();
        addBotMessage('Desculpe, ocorreu um erro. Por favor, tente novamente em alguns instantes.');
      }
      isTyping = false;
      document.getElementById('send-btn').disabled = false;
      document.getElementById('user-input').focus();
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 110) + 'px';
    }
  </script>
</body>
</html>
